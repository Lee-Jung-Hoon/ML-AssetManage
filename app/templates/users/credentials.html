{% extends "base.html" %}
{% block title %}임시 비밀번호{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<div class="secret-box" role="alert">
  <p>이 화면을 벗어나면 임시 비밀번호를 다시 볼 수 없습니다. 지금 사용자에게 안전하게 전달하세요.</p>
  <p>사용자명: <strong>{{ target.username }}</strong> ({{ target.display_name }})</p>
  <p>임시 비밀번호: <code>{{ temp_password }}</code></p>
  <p class="muted">첫 로그인 시 비밀번호 변경이 강제됩니다.</p>
</div>
<a class="button" href="/users">사용자 목록으로</a>
{% endblock %}
